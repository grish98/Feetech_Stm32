name: CI - Feetech Driver

on:
  push:
    branches: [ "main", "dev", "feat/**", "bugfix/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential cppcheck

    - name: Static Analysis (Cppcheck)
      run: |
        cppcheck --enable=warning,style,performance,portability \
                 --inline-suppr --std=c11 --force \
                 -I Lib/STS_Servo/Inc Lib/STS_Servo/Src/ --error-exitcode=1

    - name: Build and Test
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Debug
        cmake --build build
        cd build && ctest --output-on-failure

  build-firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # fail-fast: false
      matrix:
        preset: [Debug, Release]
    env:
      TOOLCHAIN_NAME: arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi
      TOOLCHAIN_URL: https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz
            # From the .sha256asc file Arm publishes next to the tarball
      TOOLCHAIN_SHA256: 8f6903f8ceb084d9227b9ef991490413014d991874a1e34074443c2a72b14dbd

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build

    - name: Restore toolchain archive from cache
      id: toolchain-cache
      uses: actions/cache@v6
      with:
        path: ~/toolchain-cache
        key: ${{ runner.os }}-${{ env.TOOLCHAIN_NAME }}-${{ env.TOOLCHAIN_SHA256 }}

    - name: Download toolchain archive
      if: steps.toolchain-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p "$HOME/toolchain-cache"
        curl -fsSL -o "$HOME/toolchain-cache/$TOOLCHAIN_NAME.tar.xz" "$TOOLCHAIN_URL"

    - name: Verify and install Arm GNU Toolchain 14.3.Rel1
      run: |
        echo "$TOOLCHAIN_SHA256  $HOME/toolchain-cache/$TOOLCHAIN_NAME.tar.xz" | sha256sum -c -
        tar -xJf "$HOME/toolchain-cache/$TOOLCHAIN_NAME.tar.xz" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/$TOOLCHAIN_NAME/bin" >> "$GITHUB_PATH"

    - name: Show compiler version
      run: arm-none-eabi-gcc --version

    - name: Configure
      run: cmake --preset ${{ matrix.preset }}

    - name: Build
      run: cmake --build --preset ${{ matrix.preset }}



  deploy-docs:
    runs-on: ubuntu-latest
    needs: [build-and-test, build-firmware]
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen cmake

      - name: Generate Documentation
        run: |
          cmake -B build
          cmake --build build --target docs

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  tag-version:
    runs-on: ubuntu-latest
    needs: [build-and-test, build-firmware]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create next version tag
        uses: actions/github-script@v7
        with:
          script: |
            const tagVersion = require('./.github/scripts/tag-version.cjs');
            await tagVersion({ github, context, core });
